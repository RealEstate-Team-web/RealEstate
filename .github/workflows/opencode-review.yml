name: OpenCode PR Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    name: AI PR Review
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode PR Review
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ secrets.OPENCODE_MODEL }}
          prompt: |
            Review this Pull Request using:

            .github/opencode/pr-review.md

            as the mandatory review policy.

            Read the current sprint documentation and all relevant
            project documentation before reviewing.

            Pay particular attention to:

            - Sprint scope
            - Out-of-scope work
            - Database correctness
            - API correctness
            - Authentication
            - Authorization
            - Security
            - Cloudinary/image upload security
            - Frontend implementation
            - Backend architecture
            - Validation
            - Error handling
            - Tests

            Do not modify files.
            Do not create commits.
            Do not push code.
            Do not approve the Pull Request.
            Do not merge the Pull Request.

            This is a review-only operation.

            Follow the output format defined in:
            .github/opencode/pr-review.md

            The Team Lead makes the final approval decision.